<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="500" height="500" viewBox="77 57 346 346"
     role="img" aria-labelledby="title desc">
  <title id="title">Tauon app icon</title>
  <desc id="desc">A colourful record icon.</desc>

  <defs>
    <linearGradient id="disc-face" x1="78" y1="62" x2="420" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset=".46" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="hub-face">
      <stop offset="0" stop-color="#282828"/>
      <stop offset=".7" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="warm-03" x1="250" y1="50" x2="70" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f1d80"/>
      <stop offset=".5" stop-color="#e65372"/>
      <stop offset="1" stop-color="#ffca5f"/>
    </linearGradient>
    <linearGradient id="cool-03" x1="430" y1="230" x2="250" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#251b59"/>
      <stop offset=".5" stop-color="#334789"/>
      <stop offset="1" stop-color="#3c7bdc"/>
    </linearGradient>
    <linearGradient id="inner-03" x1="319" y1="299" x2="181" y2="161" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e65372"/>
      <stop offset=".5" stop-color="#71306f"/>
      <stop offset="1" stop-color="#334789"/>
    </linearGradient>
    <g id="disc-base">
      <circle cx="250" cy="230" r="172" fill="url(#disc-face)" stroke="#404040" stroke-width="2"/>
      <g fill="none" stroke="#4a4a4a" stroke-width="1" opacity=".42">
        <circle cx="250" cy="230" r="159"/>
        <circle cx="250" cy="230" r="145"/>
        <circle cx="250" cy="230" r="131"/>
        <circle cx="250" cy="230" r="117"/>
      </g>
    </g>
    <g id="hub">
      <circle cx="250" cy="230" r="60" fill="url(#hub-face)" stroke="#3b3b3b"/>
      <circle cx="250" cy="230" r="29" fill="none" stroke="#2f2f2f"/>
      <circle cx="250" cy="230" r="10" fill="#0a0a0a" stroke="#464646"/>
    </g>
  </defs>

  <use href="#disc-base"/>
  <g transform="rotate(-12 250 230)" fill="none" stroke-width="62" stroke-linecap="butt">
    <circle cx="250" cy="230" r="135" stroke="url(#warm-03)" stroke-dasharray="212.06 636.17" transform="rotate(180 250 230)"/>
    <circle cx="250" cy="230" r="135" stroke="url(#cool-03)" stroke-dasharray="212.06 636.17"/>
  </g>
  <circle cx="250" cy="230" r="69" fill="url(#inner-03)"/>
  <use href="#hub"/>
  <circle cx="250" cy="230" r="4" fill="#f17867"/>
</svg>
