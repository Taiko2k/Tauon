<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="38" height="38" viewBox="103.9 103.9 422.2 422.2"
     role="img" aria-labelledby="title desc">
  <title id="title">Tauon app icon</title>
  <desc id="desc">A colourful record icon.</desc>

  <defs>
    <linearGradient id="disc" x1="125" y1="110" x2="510" y2="525"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302f38"/>
      <stop offset=".5" stop-color="#1d1c24"/>
      <stop offset="1" stop-color="#15151c"/>
    </linearGradient>
    <radialGradient id="labelFace">
      <stop offset="0" stop-color="#24232c"/>
      <stop offset=".78" stop-color="#15151c"/>
      <stop offset="1" stop-color="#0c0c13"/>
    </radialGradient>

    <linearGradient id="warm3" x1="110" y1="315" x2="315" y2="110"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b3fa5"/>
      <stop offset=".27" stop-color="#bb4f91"/>
      <stop offset=".53" stop-color="#e86678"/>
      <stop offset=".78" stop-color="#fa8a55"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <linearGradient id="cool3" x1="520" y1="315" x2="315" y2="520"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#514273"/>
      <stop offset=".32" stop-color="#506da0"/>
      <stop offset=".66" stop-color="#45a0bd"/>
      <stop offset="1" stop-color="#62d1c4"/>
    </linearGradient>
    <linearGradient id="hub3" x1="235" y1="235" x2="395" y2="395"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e86678"/>
      <stop offset=".5" stop-color="#8b4a9a"/>
      <stop offset="1" stop-color="#45a0bd"/>
    </linearGradient>

    <g id="discBody">
      <circle cx="315" cy="315" r="210"
              fill="url(#disc)" stroke="#44414c" stroke-width="2.2"/>
      <g fill="none">
        <circle cx="315" cy="315" r="201"
                stroke="#4b4854" stroke-width="1.5" opacity=".72"/>
        <circle cx="315" cy="315" r="190"
                stroke="#42404b" stroke-width="1.1" opacity=".58"/>
        <circle cx="315" cy="315" r="176"
                stroke="#3f3d48" stroke-width="1" opacity=".54"/>
        <circle cx="315" cy="315" r="162"
                stroke="#3c3a45" stroke-width="1" opacity=".5"/>
        <circle cx="315" cy="315" r="148"
                stroke="#393742" stroke-width=".9" opacity=".46"/>
        <circle cx="315" cy="315" r="134"
                stroke="#373540" stroke-width=".9" opacity=".43"/>
      </g>
    </g>

    <path id="warmQuarter"
          d="M 106.1 315 A 208.9 208.9 0 0 1 315 106.1
             L 315 192 A 123 123 0 0 0 192 315 Z"/>
    <path id="coolQuarter"
          d="M 523.9 315 A 208.9 208.9 0 0 1 315 523.9
             L 315 438 A 123 123 0 0 0 438 315 Z"/>
  </defs>

  <use href="#discBody"/>
  <use href="#warmQuarter" fill="url(#warm3)"/>
  <use href="#coolQuarter" fill="url(#cool3)"/>
  <circle cx="315" cy="315" r="83" fill="url(#hub3)"/>
  <circle cx="315" cy="315" r="73" fill="url(#labelFace)"
          stroke="#34323d"/>
  <circle cx="315" cy="315" r="15" fill="#0a0a11"
          stroke="#3b3945"/>
  <circle cx="315" cy="315" r="4" fill="#e86678"/>
</svg>
