name: LSP Check

on:
  push:
    paths-ignore:
      - 'locale/**'
  pull_request:
    paths-ignore:
      - 'locale/**'

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            gobject-introspection \
            gir1.2-pango-1.0 \
            gir1.2-rsvg-2.0 \
            gir1.2-notify-0.7 \
            gir1.2-girepository-3.0-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            python3-gi-cairo \
            libayatana-appindicator3-dev \
            libcairo2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libjxl-dev \
            libflac-dev \
            libgme-dev \
            libmpg123-dev \
            libopenmpt-dev \
            libopusfile-dev \
            libsamplerate0-dev \
            libvorbis-dev \
            libwavpack-dev \
            p7zip
          # JPEG-XL hack since 24.04 is too old
          sudo apt-get install -y \
            libgif7 \
            liblcms2-dev
          # Each download must match the SHA-256 it had when it was pinned
          fetch() {
            curl -fsSL --retry 3 -o "$1" "$2"
            echo "$3  $1" | sha256sum --check --strict
          }
          pool=https://old-releases.ubuntu.com/ubuntu/pool/universe
          fetch libjxl-dev.deb "${pool}/j/jpeg-xl/libjxl-dev_0.10.3-4ubuntu1_amd64.deb" 05fdfdb98206489183320efefb8500d4dedac0b235042940a44c94ced075433e
          fetch libjxl.deb     "${pool}/j/jpeg-xl/libjxl0.10_0.10.3-4ubuntu1_amd64.deb" d494af89f272bdaf052d93e7d55030137c488a654a8640db66f988ca4b3a153b
          fetch libhwy-dev.deb "${pool}/h/highway/libhwy-dev_1.2.0-3ubuntu2_amd64.deb"  ebb35a856835bcd878e20c9c2e38dd46d8ca9145a1cc4b4c17a630c03f069b12
          fetch libhwy.deb     "${pool}/h/highway/libhwy1t64_1.2.0-3ubuntu2_amd64.deb"  d623d4ea0ad56a4e2d39545d5941dfba7120700b631438f092df3508d73947f6
          sudo dpkg -i *.deb
        #    libsdl2-image-dev \
        #  wget http://mirrors.edge.kernel.org/ubuntu/pool/main/l/lcms2/liblcms2-dev_2.14-2build1_amd64.deb

      # Pyright only needs the Python dependencies, so skip the native build
      # (and SDL3, which Ubuntu does not package) and use the source tree
      - name: Install Python dependencies and setup venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python - > requirements.txt <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
            project = tomllib.load(f)["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["all"]))
          PY
          pip install -r requirements.txt
          echo "${PWD}/src" > "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')/tauon-src.pth"

      - name: Let Pyright use our venv
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run pyright
        continue-on-error: true
        uses: jakebailey/pyright-action@v3
        with:
#          venv-path: .venv
          working-directory: 'src/tauon'

