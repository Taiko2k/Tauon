name: Build extras

on:
  workflow_dispatch:

jobs:
  build-windows-x64-lrclib_solver_exe:
    name: "lrclib-solver-x64.exe"
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up MSYS2 MinGW-W64
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            cmake
            make
            ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust

      - name: Build lrclib-solver.exe
        shell: msys2 {0}
        run: |
          cargo build --release --manifest-path src/lrclib-solver/Cargo.toml --bin lrclib-solver

      - name: Upload lrclib-solver.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrclib-solver-windows-x64
          path: src/lrclib-solver/target/release/lrclib-solver.exe
          if-no-files-found: error
          retention-days: 14

  build-windows-TauonSMTC_dll:
    name: "TauonSMTC.dll"
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Locate MSBuild via vswhere and add to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $msbuildPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuildPath) {
            throw "MSBuild.exe not found by vswhere."
          }
          Write-Host "MSBuild at: $msbuildPath"
          # Persist the MSBuild directory to PATH for next steps
          $msbuildDir = Split-Path $msbuildPath -Parent
          "$msbuildDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show MSBuild version
        shell: cmd
        run: msbuild -version

      - name: Build TauonSMTC.sln (Release)
        shell: cmd
        run: |
          msbuild src/smtc/TauonSMTC.sln /p:Configuration=Release /m

      - name: Locate built TauonSMTC.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "${{ github.workspace }}" -Filter "TauonSMTC.dll" -Recurse `
                  | Where-Object { $_.FullName -match "\\Release\\" } `
                  | Select-Object -First 1
          if (-not $dll) { throw "TauonSMTC.dll not found under a Release directory." }
          "TAUON_SMTC_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found: $($dll.FullName)"

      - name: Upload TauonSMTC.dll artifact
        uses: actions/upload-artifact@v7
        with:
          name: TauonSMTC-dll
          path: ${{ env.TAUON_SMTC_DLL }}
          if-no-files-found: error
          retention-days: 14

  build-linux-x64-lrclib_solver:
    name: "Linux x64 lrclib-solver"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Build lrclib-solver
        run: |
          cargo build --release --manifest-path src/lrclib-solver/Cargo.toml --bin lrclib-solver

      - name: Upload lrclib-solver artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrclib-solver-linux-x64
          path: src/lrclib-solver/target/release/lrclib-solver
          if-no-files-found: error
          retention-days: 14

  build-linux-arm64-lrclib_solver:
    name: "Linux arm64 lrclib-solver"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Build lrclib-solver
        run: |
          cargo build --release --manifest-path src/lrclib-solver/Cargo.toml --bin lrclib-solver

      - name: Upload lrclib-solver artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrclib-solver-linux-arm64
          path: src/lrclib-solver/target/release/lrclib-solver
          if-no-files-found: error
          retention-days: 14

  build-macOS-arm64-lrclib_solver:
    name: "macOS arm64 lrclib-solver"
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Build lrclib-solver
        run: |
          cargo build --release --manifest-path src/lrclib-solver/Cargo.toml --bin lrclib-solver

      - name: Upload lrclib-solver artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrclib-solver-macos-arm64
          path: src/lrclib-solver/target/release/lrclib-solver
          if-no-files-found: error
          retention-days: 14
