name: Build and release

on:
  push:
    paths-ignore:
      - 'locale/**'
  pull_request:
    paths-ignore:
      - 'locale/**'
jobs:
  build-linux:
    name: "Linux ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
            # Keep the established release asset name for x64
            artifact: TauonMusicBox-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            artifact: TauonMusicBox-linux-arm64
    env:
      SDL_VERSION: "3.4.0"
      # Of the SDL3-<version>.tar.gz release asset
      SDL_SHA256: "082cbf5f429e0d80820f68dc2b507a94d4cc1b4e70817b119bbb8ec6a69584b8"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            cmake \
            gobject-introspection \
            gir1.2-pango-1.0 \
            gir1.2-rsvg-2.0 \
            gir1.2-notify-0.7 \
            gir1.2-girepository-3.0-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            python3-gi-cairo \
            libayatana-appindicator3-dev \
            libcairo2-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libjxl-dev \
            libflac-dev \
            libchromaprint-dev \
            libgme-dev \
            libmpg123-dev \
            libopenmpt-dev \
            libopusfile-dev \
            libsamplerate0-dev \
            libvorbis-dev \
            libwavpack-dev \
            libxss-dev \
            ninja-build \
            patchelf \
            pkg-config \
            xvfb \
            p7zip
          # JPEG-XL hack since 24.04 is too old
          sudo apt-get install -y \
            libgif7 \
            liblcms2-dev
          # Release assets can be replaced, so each download must match the
          # SHA-256 it had when it was pinned
          fetch() {
            curl -fsSL --retry 3 -o "$1" "$2"
            echo "$3  $1" | sha256sum --check --strict
          }
          extras=https://github.com/Taiko2k/Tauon/releases/download/Extras
          if [ "${{ matrix.arch }}" = x64 ]; then
            fetch libjxl-dev.deb "${extras}/libjxl-dev_0.10.3-4ubuntu1_amd64.deb" 05fdfdb98206489183320efefb8500d4dedac0b235042940a44c94ced075433e
            fetch libjxl.deb     "${extras}/libjxl0.10_0.10.3-4ubuntu1_amd64.deb" d494af89f272bdaf052d93e7d55030137c488a654a8640db66f988ca4b3a153b
            fetch libhwy-dev.deb "${extras}/libhwy-dev_1.2.0-3ubuntu2_amd64.deb"  ebb35a856835bcd878e20c9c2e38dd46d8ca9145a1cc4b4c17a630c03f069b12
            fetch libhwy.deb     "${extras}/libhwy1t64_1.2.0-3ubuntu2_amd64.deb"  d623d4ea0ad56a4e2d39545d5941dfba7120700b631438f092df3508d73947f6
            fetch lrclib-solver  "${extras}/lrclib-solver-linux-x64"              b8becce458918941428bf16725ff790f48401b3053c564b7c7962fe70ea74a95
          else
            fetch libjxl-dev.deb "${extras}/libjxl-dev_0.10.3-4ubuntu1_arm64.deb" c2fe61a6110f0e29cf8bb4eb49dd1b542c587177c39492da1b249f4b409d7758
            fetch libjxl.deb     "${extras}/libjxl0.10_0.10.3-4ubuntu1_arm64.deb" 11bf8e65a71af025893bd2334f2efc390be08d87e3f63775ab372a8401617b4f
            fetch libhwy-dev.deb "${extras}/libhwy-dev_1.2.0-3ubuntu2_arm64.deb"  58b4cabf50b4993de7c435f9c7b037c331376cb105d24a34a35b48e54597e8d9
            fetch libhwy.deb     "${extras}/libhwy1t64_1.2.0-3ubuntu2_arm64.deb"  f41efe00549002f437349f41ae04a760db477ad275b1913690c9c9ea24ca2273
            fetch lrclib-solver  "${extras}/lrclib-solver-linux-arm64"            06f0a3ca4b5ba05c22b6d6b83a39e88d677aaf8c0850135d4a4c3c5d616870a7
          fi
          sudo dpkg -i *.deb
        # wget https://github.com/Taiko2k/Tauon/releases/download/Extras/liblcms2-dev_2.14-2build1_amd64.deb

      - name: Build SDL3
        run: |
          mkdir -p build/sdl-src
          curl -fsSL --retry 3 -o build/sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          echo "${SDL_SHA256}  build/sdl.tar.gz" | sha256sum --check --strict
          tar --strip-components=1 -xf build/sdl.tar.gz -C build/sdl-src
          cmake -S build/sdl-src -B build/sdl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PWD}/build/sdl-prefix" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build build/sdl-build --parallel
          cmake --install build/sdl-build

      # Builds the launcher, Phazor and translations through CMake and installs
      # them with the Python package into the virtual environment
      - name: Build and install Tauon into a venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          CMAKE_PREFIX_PATH="${PWD}/build/sdl-prefix" pip install ".[all]"

      - name: Assemble relocatable Linux bundle
        run: |
          source .venv/bin/activate
          LD_LIBRARY_PATH="${PWD}/build/sdl-prefix/lib:${LD_LIBRARY_PATH}" \
            python tools/package_bundle.py \
            --platform linux \
            --output dist/package \
            --portable

      - name: Smoke test staged Linux bundle
        run: |
          xvfb-run -a dist/package/TauonMusicBox/tauon --tray --native-smoke-test

      - name: Create 7Z
        run: |
          APP_NAME="TauonMusicBox"
          cd "dist/package/${APP_NAME}"

          ARCHIVE_PATH="../../${{ matrix.artifact }}.7z"

          7z a -r -snl "${ARCHIVE_PATH}" "."

      - name: Upload 7Z artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.7z
          archive: false

  build-macos-arm64:
    name: "macOS arm64"
    # Keep lowest version we can reasonably build on,
    # as that's the resulting minimally-supported macOS version in the built app
    runs-on: macos-15
    env:
      # Pinned projectM master for the Milkdrop visualiser library
      PROJECTM_COMMIT: 149bfc43963e54e397ccdb42f27019d22b659098
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pip cache-key
        uses: actions/cache@v6
        if: startsWith(runner.os, 'macOS')
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: brew update
        run: brew untap aws/tap && brew update

      - name: Force install openssl@3 to prevent a bug with current images
        run: brew install --overwrite openssl@3

      - name: Install brew dependencies
        run: |
          brew install \
            gobject-introspection \
            pango \
            pillow \
            sdl3 \
            sdl3_image \
            jpeg-xl \
            libsamplerate \
            ffmpeg \
            chromaprint \
            librsvg \
            opusfile \
            libopenmpt \
            wavpack \
            game-music-emu \
            ninja \
            create-dmg \
            python@3.15

      - name: Remove aws-sam-cli as it makes pydantic core preinstalled in brew but we want to use pip's
        run: brew uninstall aws-sam-cli pydantic

      # This generates 30MB of logs, enable it only when actively debugging something
      #- name: "[DEBUG] List all Cellar files"
      #  run: find /opt/homebrew/Cellar

      - name: Download lirclib solver
        run: |
          curl -fsSL --retry 3 -o lrclib-solver https://github.com/Taiko2k/Tauon/releases/download/Extras/lrclib-solver-macos-arm64
          echo "3f655b3c85f3de950aafd5301cfc8470421ed5d9c52bec164fdfd0eb4d102e57  lrclib-solver" | shasum -a 256 --check --strict

      - name: Build macOS Now Playing helper
        run: |
          bash src/nowplaying/build_app.sh

      # Builds the launcher, Phazor and translations through CMake and installs
      # them with the Python package into the virtual environment
      - name: Build and install Tauon into a venv
        run: |
          export CXXFLAGS="-I/opt/homebrew/include"
          export LDFLAGS="-L/opt/homebrew/lib"
          export CMAKE_PREFIX_PATH="$(brew --prefix)"
          $(brew --prefix python@3.15)/libexec/bin/python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            --no-cache-dir \
            --no-binary=jxlpy \
            ".[all]" \
            pytest

      - name: Run tests using pytest
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest src/tauon/tests

      - name: Cache projectM build
        id: cache-projectm
        uses: actions/cache@v6
        with:
          path: build/projectm
          key: ${{ runner.os }}-${{ runner.arch }}-projectm-${{ env.PROJECTM_COMMIT }}

      - name: Build projectM
        if: steps.cache-projectm.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/projectM-visualizer/projectm.git build/projectm-src
          git -C build/projectm-src checkout "${PROJECTM_COMMIT}"
          git -C build/projectm-src submodule update --init --recursive
          cmake -S build/projectm-src -B build/projectm-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_SDL_UI=OFF \
            -DCMAKE_INSTALL_PREFIX="${PWD}/build/projectm"
          cmake --build build/projectm-src/build -j3
          cmake --install build/projectm-src/build

      - name: Assemble relocatable macOS app
        run: |
          .venv/bin/python tools/package_bundle.py \
            --platform macos \
            --projectm build/projectm/lib/libprojectM-4.4.dylib \
            --output dist/package

      - name: Ensure Now Playing helper is executable
        run: |
          chmod +x \
            "dist/package/Tauon.app/Contents/Resources/python/site-packages/tauon/lib/TauonNowPlaying.app/Contents/MacOS/TauonNowPlaying"

      - name: Smoke test staged macOS app
        run: |
          "dist/package/Tauon.app/Contents/MacOS/Tauon" --tray --native-smoke-test
          codesign --verify --deep --strict --verbose=2 "dist/package/Tauon.app"
          ! find "dist/package/Tauon.app" -type f -exec otool -L {} \; 2>/dev/null \
            | grep -E '/opt/homebrew|/usr/local|/Users/runner/work'

      - name: Generate DMG background image
        run: |
          .venv/bin/python extra/generate_dmg_background.py dist/dmg-background.png

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          APP_NAME="Tauon"
          APP_PATH="dist/package/${APP_NAME}.app"
          DMG_PATH="dist/dmg/${APP_NAME}.dmg"

          # FIXME: Undo this overengineered crap once the following issue gets figured out:
          #        https://github.com/actions/runner-images/issues/7522
          i=0
          until create-dmg \
            --volname "${APP_NAME}" \
            --background "dist/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 540 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 170 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 390 170 \
            "${DMG_PATH}" \
            "${APP_PATH}"; do
            if [[ ${i} -eq 10 ]]; then
              echo "Error: create-dmg did not succeed even after 10 tries."
              exit 1
            fi
            i=$((i+1))
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Tauon-dmg
          path: dist/dmg/Tauon.dmg
          archive: false

  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pip cache-key
        uses: actions/cache@v6
        if: startsWith(runner.os, 'Windows')
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # TODO(Martin): p7zip should be 7zip but MSYS2 hasn't updated at the time of writing, try switching it later
      - name: Read Package List
        id: read_packages
        run: |
          $packages = Get-Content extra/msyspac.txt -Raw | Out-String
          $packages = $packages -replace "`r`n", " " -replace "`n", " "
          $packages = $packages.Trim() + " p7zip"
          echo "packages=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: ${{ env.packages }}

      - name: Update CA trust and hack opusfile - https://github.com/xiph/opusfile/pull/47
        shell: msys2 {0}
        run: |
          update-ca-trust
          sed -i 's,<opus_multistream.h>,<opus/opus_multistream.h>,' "${MSYSTEM_PREFIX}/include/opus/opusfile.h"

      # Builds the launcher, Phazor and translations through CMake and installs
      # them with the Python package into the virtual environment
      - name: Build and install Tauon into a venv
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages --upgrade pip
          python -m venv .venv
          export CFLAGS="-I${MSYSTEM_PREFIX}/include"
          export CMAKE_PREFIX_PATH="${MSYSTEM_PREFIX}"
          .venv/bin/python -m pip install ".[all]"

      - name: Read version from pyproject.toml
        shell: msys2 {0}
        id: version
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml","rb") as f:
            data = tomllib.load(f)
          # falls back cleanly if you ever switch to dynamic versioning
          version = data.get("project", {}).get("version")
          if not version:
            raise SystemExit("project.version not found in pyproject.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"version={version}\n")
          print(f"Detected version: {version}")
          PY

      # https://github.com/Taiko2k/Tauon/pull/931#issuecomment-1464880133
      - name: Download optionals from latest release files and notofonts' GitHub
        shell: msys2 {0}
        run: |
          set -eo pipefail
          # Release assets can be replaced, so each download must match the
          # SHA-256 it had when it was pinned. Fonts come from fixed commits.
          fetch() {
            curl -fsSL --retry 3 -o "$1" "$2"
            echo "$3  $1" | sha256sum --check --strict
          }
          extras=https://github.com/Taiko2k/Tauon/releases/download/Extras
          noto=https://github.com/notofonts/notofonts.github.io/raw/5c3913063bb189df4edc94b766584dfb4c04a187/fonts/NotoSans/full/ttf
          noto_cjk=https://github.com/notofonts/noto-cjk/raw/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese
          fetch lrclib-solver.exe "${extras}/lrclib-solver-windows-x64.exe" 95c874e516bffaeac6d5f17260c088938e411a0b1dcf90699c77cec2adf2a7a4
          fetch TauonSMTC.dll     "${extras}/TauonSMTC.dll"                 98a19392d17c3da3ae0e04b99d5d1a1ea54d377a762d6b8bde3d0c6154e254dd
          mkdir fonts
          fetch fonts/NotoSans-ExtraCondensed.ttf     "${noto}/NotoSans-ExtraCondensed.ttf"     378c95db3ac074e5ffdb5491cfe4c4b5eadb431b71281164f974a3d4e70ac3ba # 800KB
          fetch fonts/NotoSans-ExtraCondensedBold.ttf "${noto}/NotoSans-ExtraCondensedBold.ttf" cc63d525eee76665becc0c8bdebb4b4c6e9e4764215f9949576ea81062ea1f79 # 800KB
          fetch fonts/NotoSans-Bold.ttf               "${noto}/NotoSans-Bold.ttf"               3a08a47daa00cade516425c15c57615aef2fd418ec9811a7b9f465088f92cc05 # 800KB
          fetch fonts/NotoSans-Medium.ttf             "${noto}/NotoSans-Medium.ttf"             1d1570dd66d70cbcd56646c55580c3cc453c7abc505534230c165f93b55ad394 # 800KB
          fetch fonts/NotoSans-Regular.ttf            "${noto}/NotoSans-Regular.ttf"            f5f552c8c5edb61fe6efb824baf4d4de47b1a8689ab4925ff43f7bd6a4ebece5 # 800KB
          fetch fonts/NotoSansCJKjp-Bold.otf          "${noto_cjk}/NotoSansCJKjp-Bold.otf"      e53dcb0dcb2922e45d01aae1ebd2f382bb81d4229b18b6b883bd170678af1f76 # 16MB
          fetch fonts/NotoSansCJKjp-Medium.otf        "${noto_cjk}/NotoSansCJKjp-Medium.otf"    dd523e580e3413c480b2d701bf64e534c20f8419e3cfb6a44c2bdcd8d2a6c052 # 16MB
          fetch fonts/NotoSansCJKjp-Regular.otf       "${noto_cjk}/NotoSansCJKjp-Regular.otf"   68a3fc98800b2a27b371f2fb79991daf3633bd89309d4ffaa6946fd587f375b5 # 16MB

      - name: Assemble relocatable Windows app
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          python tools/package_bundle.py \
            --platform windows \
            --projectm "${MSYSTEM_PREFIX}/bin/libprojectM-4-4.dll" \
            --output dist/package \
            --portable

      - name: Smoke test staged Windows bundle
        shell: msys2 {0}
        run: |
          "dist/package/TauonMusicBox/Tauon Music Box.exe" --tray --native-smoke-test

      - name: Create 7Z
        shell: msys2 {0}
        run: |
          APP_NAME="TauonMusicBox"
          cd "dist/package/${APP_NAME}"

          ARCHIVE_PATH="../../${APP_NAME}-windows.7z"

          7z a -r "${ARCHIVE_PATH}" "."

      - name: Upload 7Z artifact
        uses: actions/upload-artifact@v7
        with:
          name: TauonMusicBox-windows
          path: dist/TauonMusicBox-windows.7z
          archive: false

      - name: Remove portable flag
        shell: msys2 {0}
        run: |
          rm "dist/package/TauonMusicBox/portable"

      - name: Replace Tauon version in .ISS
        run: |
          sed -i "s|{{ tauon_version }}|${{ steps.version.outputs.version }}|g" extra/setup.iss

      - name: Get current drive letter and replace what's in .ISS
        shell: pwsh
        run: |
          $Drive = (Get-Item -Path "${{ github.workspace }}").PSDrive.Name + ":\"
          (Get-Content extra/setup.iss) -replace "C:\\", $Drive | Set-Content extra/setup.iss

      - name: Compile .ISS to .EXE Installer
        uses: C0rn3j/Inno-Setup-Action@v1.2.9
        with:
          path: extra/setup.iss
          options: /O+
          install_latest: true

      #- name: "[DEBUG] List all files after Inno"
      #  shell: msys2 {0}
      #  run: find .

      - name: Rename installer
        shell: bash
        run: |
          mv \
            "extra/Output/tauonsetup-${{ steps.version.outputs.version }}.exe" \
            "extra/Output/TauonMusicBox-windows-installer.exe"

      - name: Upload EXE installer
        uses: actions/upload-artifact@v7
        with:
          name: TauonMusicBox-windows-installer
          path: extra/Output/TauonMusicBox-windows-installer.exe
          archive: false

  get-info:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
      - uses: actions/checkout@v7
      - name: Get date and git hash
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  pre-release:
    if: github.ref == 'refs/heads/master' && github.repository == 'Taiko2k/Tauon' && github.event_name == 'push'
    needs: [get-info, build-linux, build-windows-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ~/artifacts

      - name: Get latest release information
        id: get_latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}"
          latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
          echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Process template release_body.md
        run: |
          sed -i 's|RELEASE_TAG|Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}|g' ${{ github.workspace }}/.github/release_body.md


      - name: Create Pre-Release on GitHub
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          tag: "Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
          draft: false
          prerelease: true
          #body: "Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/Taiko2k/Tauon/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})"
          bodyFile: ${{ github.workspace }}/.github/release_body.md
          artifacts: |
            ~/artifacts/**/**/*.7z
            ~/artifacts/**/**/*.dmg
            ~/artifacts/**/**/*.exe

      - name: Publish to Release Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS_DIR=~/artifacts
          REPO="Taiko2k/Tauon"

          for file in "$ARTIFACTS_DIR"/**/*.{7z,dmg,exe}; do
            filename=$(basename "$file")
            # Check if release already exists and get ID
            release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}" | jq -r '.id')

            if [[ "$release_id" == "null" ]]; then
              echo "Creating release in $REPO for $filename"
              release_id=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d '{
                  "tag_name": "Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}",
                  "name": "Pre-release-Tauon-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}",
                  "draft": false,
                  "prerelease": true,
                  "body": "Commit: [${{ needs.get-info.outputs.fullhash }}](https://github.com/Taiko2k/Tauon/commit/${{ needs.get-info.outputs.fullhash }})"
                }' "https://api.github.com/repos/$REPO/releases" | jq -r '.id')
            else
              echo "Release already exists in $REPO with ID $release_id"
            fi

            # Artifact upload
            echo "Uploading $filename to release $release_id in $REPO"
            upload_url="https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$filename"
            curl -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$upload_url"
          done

      - name: Get current pre-release information
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}/releases"

          # Get all releases (sorted by date)
          releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")

          # Capture the most recent pre-release (assuming the first one is the latest)
          current_release=$(echo "$releases" | jq -c '.[] | select(.prerelease == true) | .published_at' | sort -r | head -n 1)

          # Remove extra quotes from captured date
          current_release=$(echo $current_release | tr -d '"')

          # Export the current published_at to be available for the next step
          echo "CURRENT_PUBLISHED_AT=$current_release" >> $GITHUB_ENV

      - name: Delete old pre-releases and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}/releases"

          # Get current pre-releases
          releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")

          # Remove extra quotes from captured date
          CURRENT_PUBLISHED_AT=$(echo $CURRENT_PUBLISHED_AT | tr -d '"')

          # Convert CURRENT_PUBLISHED_AT para timestamp Unix
          current_published_ts=$(date -d "$CURRENT_PUBLISHED_AT" +%s)

          # Identify pre-releases
          echo "$releases" | jq -c '.[] | select(.prerelease == true)' | while read -r release; do
            release_date=$(echo "$release" | jq -r '.published_at')
            release_id=$(echo "$release" | jq -r '.id')
            release_tag=$(echo "$release" | jq -r '.tag_name')

            # Remove extra quotes from captured date
            release_date=$(echo $release_date | tr -d '"')

            # Convert release_date para timestamp Unix
            release_date_ts=$(date -d "$release_date" +%s)

            # Compare timestamps and delete old pre-releases
            if [[ "$release_date_ts" -lt "$current_published_ts" ]]; then
              echo "Deleting old pre-release: $release_id from $release_date with tag: $release_tag"
              # Delete the pre-release
              curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api_url/$release_id"
              # Delete the tag
              curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag"
            else
              echo "Skipping pre-release: $release_id (newer or same date)"
            fi
          done
